name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP if present
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "فایل ZIP پیدا شد: $ZIP_FILE — در حال باز کردن..."
            unzip -o -q "$ZIP_FILE" -d _extracted
            rm -f "$ZIP_FILE"
            PROJECT_DIR=$(find _extracted -iname "settings.gradle.kts" | head -n 1 | xargs dirname)
            if [ -z "$PROJECT_DIR" ]; then
              echo "::error::بعد از باز کردن ZIP، فایل settings.gradle.kts پیدا نشد."
              exit 1
            fi
            shopt -s dotglob
            mv "$PROJECT_DIR"/* .
            rm -rf _extracted
          else
            echo "فایل ZIP پیدا نشد؛ فرض می‌شود پروژه از قبل به‌صورت پوشه آپلود شده است."
          fi

      - name: Check google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "::error::فایل app/google-services.json پیدا نشد."
            exit 1
          fi
          if ! grep -q "com.baharhooni.morkhesi" app/google-services.json; then
            echo "::error::نام پکیج داخل google-services.json درست نیست."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MorkhesiBaharHooni-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
